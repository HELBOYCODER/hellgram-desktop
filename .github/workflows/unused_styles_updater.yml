name: Unused styles updater.

on:
  repository_dispatch:
    types: ["Restart unused_styles_updater workflow."]
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  Unused-styles:
    runs-on: ubuntu-latest
    steps:
      - name: Work around upstream simple-git ESM import bug
        # Temporary workaround: desktop-app/action_code_updater@master imports
        # simple-git with a default import, but the current simple-git ESM
        # build has no default export, so the action fails at startup with
        # "SyntaxError: The requested module 'simple-git' does not provide
        # an export named 'default'". The action is downloaded during
        # "Set up job", so the import can be fixed in place before it runs.
        # Remove this step when upstream fixes the import.
        run: |
          file="${GITHUB_WORKSPACE}/../_actions/desktop-app/action_code_updater/master/index.mjs"
          sed -i 's/^import simpleGit from "simple-git";$/import { simpleGit } from "simple-git";/' "$file"
          grep -n "simple-git" "$file"
      - uses: desktop-app/action_code_updater@master
        with:
          type: "unused-styles"
