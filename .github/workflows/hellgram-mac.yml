name: Hellgram Desktop macOS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hellgram-mac.yml'

permissions:
  contents: write

jobs:
  macos:
    name: MacOS
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      REPO_NAME: hellgram-desktop
      PREPARE_PATH: Telegram/build/prepare/prepare.py
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: Setup
        run: |
          sudo chown -R `whoami`:admin /usr/local/share
          brew update
          brew install automake libtool meson nasm ninja pkg-config
          sudo mdutil -a -i off
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Libraries cache
        uses: actions/cache@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Libraries
        run: ./${{ env.REPO_NAME }}/Telegram/build/prepare/mac.sh skip-release silent

      - name: Build
        run: |
          cd ${{ env.REPO_NAME }}/Telegram
          ./configure.sh \
          -D CMAKE_CONFIGURATION_TYPES=Debug \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -D TDESKTOP_API_ID=38159064 \
          -D TDESKTOP_API_HASH=d0372642fc663849324f887acf9a64c5 \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ../out --config Debug --parallel

      - name: Bundle Hellboy Tunnel engine (Aether).
        run: |
          cd ${{ env.REPO_NAME }}/out/Debug
          curl -sL -o aether-arm64.tar.gz https://github.com/CluvexStudio/Aether/releases/download/v2.1.0/aether-macos-arm64.tar.gz
          curl -sL -o aether-x64.tar.gz https://github.com/CluvexStudio/Aether/releases/download/v2.1.0/aether-macos-x86_64.tar.gz
          mkdir -p eng
          tar xzf aether-arm64.tar.gz -C eng
          tar xzf aether-x64.tar.gz -C eng || true
          ENGINE=$(find eng -name aether -type f | head -1)
          mkdir -p Hellgram.app/Contents/MacOS
          cp "$ENGINE" Hellgram.app/Contents/MacOS/hellboy-engine
          chmod +x Hellgram.app/Contents/MacOS/hellboy-engine
          printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" \&\& pwd)"\nexec "$DIR/hellboy-engine" --bind 127.0.0.1:1819 -4 --masque --turbo --noize firewall\n' > Hellgram.app/Contents/MacOS/hellboy-tunnel
          chmod +x Hellgram.app/Contents/MacOS/hellboy-tunnel
          codesign --force --sign - Hellgram.app/Contents/MacOS/hellboy-engine || true
          rm -rf eng aether-arm64.tar.gz aether-x64.tar.gz

      - name: Package
        run: |
          cd ${{ env.REPO_NAME }}/out/Debug
          ditto -c -k --sequesterRsrc --keepParent Telegram.app "$RUNNER_TEMP/Hellgram-mac-arm64.zip"
          ls -la "$RUNNER_TEMP/Hellgram-mac-arm64.zip"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create hellgram-mac-latest \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Hellgram Desktop macOS (Release)" \
            --target "$GITHUB_SHA" \
            --notes "Hellgram native macOS build ($GITHUB_SHA): Telegram Desktop + Hellgram branding. unsigned: right-click > Open on first launch." 2>/dev/null || true
          gh release upload hellgram-mac-latest \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$RUNNER_TEMP/Hellgram-mac-arm64.zip"
          gh release edit hellgram-mac-latest --repo "$GITHUB_REPOSITORY" --draft=false
